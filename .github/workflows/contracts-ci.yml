name: contracts-ci

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: contracts/.nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint the spec
        run: npm run lint
      - name: Test
        run: npm test
